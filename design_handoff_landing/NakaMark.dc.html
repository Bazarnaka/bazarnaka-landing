<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ wrapStyle }}"><sc-for list="{{ petals }}" as="p" hint-placeholder-count="8"><div style="{{ p.style }}"></div></sc-for></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:48,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:12,&quot;max&quot;:400},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D75448&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#D75448&quot;,&quot;#F9C74A&quot;,&quot;#FFE9B5&quot;,&quot;#FFFFFF&quot;]}}">
class Component extends DCLogic {
  renderVals() {
    const size = Number(this.props.size ?? 48);
    const color = this.props.color ?? "#D75448";
    const petalW = size * 0.215, petalL = size * 0.36, inner = size * 0.145;
    const petals = [];
    for (let i = 0; i < 8; i++) {
      petals.push({ style: {
        position: "absolute", left: "50%", top: "50%", width: petalW + "px", height: petalL + "px",
        background: color, borderRadius: `0 0 ${petalW / 2}px ${petalW / 2}px`,
        transform: `translate(-50%,-50%) rotate(${i * 45}deg) translateY(${-(inner + petalL / 2)}px)`
      }});
    }
    return { petals, wrapStyle: { position: "relative", width: size + "px", height: size + "px", flex: "none" } };
  }
}
</script>
</body>
</html>
